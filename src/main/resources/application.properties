spring.application.name=axegestor

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/axegestor}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

api.security.token.secret=${JWT_SECRET:troque-este-segredo-em-desenvolvimento}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:8}
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
