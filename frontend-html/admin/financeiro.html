<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financeiro - AxeGestor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <h2>AxeGestor</h2>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a href="assistencias.html">Assistências</a>
          <a class="active" href="financeiro.html">Financeiro</a>
          <a href="estoque.html">Estoque</a>
          <a href="membros.html">Membros</a>
          <a href="#" id="logout">Sair</a>
        </nav>
      </aside>
      <main class="content">
        <header class="page-header">
          <div>
            <p class="eyebrow">Controle financeiro</p>
            <h1>Financeiro</h1>
          </div>
          <button class="secondary-button" onclick="carregarFinanceiro()">Atualizar</button>
        </header>

        <section class="card form-card">
          <h2>Novo lançamento</h2>
          <div class="form-grid">
            <label>Descrição<input id="descricao" type="text" placeholder="Mensalidade, doação..." /></label>
            <label>Membro<select id="membroId"><option value="">Sem membro vinculado</option></select></label>
            <label>Responsável<input id="responsavel" type="text" placeholder="Nome do responsável" /></label>
            <label>Valor<input id="valor" type="number" min="0.01" step="0.01" placeholder="0,00" /></label>
            <label>Data do lançamento<input id="dataLancamento" type="date" /></label>
            <label>Vencimento<input id="dataVencimento" type="date" /></label>
            <label>Tipo<select id="tipo"><option value="RECEITA">Receita</option><option value="DESPESA">Despesa</option></select></label>
            <label>Categoria<select id="categoria"><option value="MENSALIDADE">Mensalidade</option><option value="DOACAO">Doação</option><option value="MATERIAL_RITUALISTICO">Material ritualístico</option><option value="ALUGUEL">Aluguel</option><option value="AGUA">Água</option><option value="LUZ">Luz</option><option value="INTERNET">Internet</option><option value="LIMPEZA">Limpeza</option><option value="MANUTENCAO">Manutenção</option><option value="EVENTO">Evento</option><option value="CURSO">Curso</option><option value="OUTROS">Outros</option></select></label>
            <label>Status<select id="status"><option value="PENDENTE">Pendente</option><option value="PAGO">Pago</option><option value="ATRASADO">Atrasado</option><option value="CANCELADO">Cancelado</option></select></label>
          </div>
          <div class="actions-row"><button onclick="salvarLancamento()">Salvar lançamento</button></div>
        </section>

        <section class="card search-card">
          <h2>Mensalidades dos membros</h2>
          <div class="search-row">
            <input id="mesMensalidade" type="month" />
            <button onclick="carregarMensalidades()">Buscar mês</button>
          </div>
          <div id="listaMensalidades" class="cards list-cards"></div>
        </section>

        <section id="listaFinanceiro" class="cards list-cards"></section>
      </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/financeiro.js"></script>
  </body>
</html>
