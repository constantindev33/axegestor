<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AxeGestor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <main class="login-shell">
      <section class="login-box">
        <p class="login-kicker">Administração</p>
        <h1>AxeGestor</h1>
        <p class="login-subtitle">Acesse o painel de gestão com seu e-mail e senha.</p>

        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" />

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password" />

        <button id="btn-login">Entrar</button>

        <div class="erro" id="erro" role="alert"></div>
      </section>
    </main>

    <script src="js/login.js"></script>
  </body>
</html>
